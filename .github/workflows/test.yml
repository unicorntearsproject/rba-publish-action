# Offline tests and the repository scan. No secrets, read-only token: safe for
# pull requests from forks.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both runner images callers use: 22.04's tools are older (curl 7.81).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # the scan reads every commit's metadata
          persist-credentials: false
      - name: Scan for anything identifying or secret
        run: tests/scan_repo.sh
      - name: Shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh tests/*.sh tests/fake-aws/aws tests/fake-gh/gh tests/fake-curl/curl
      - name: Release checks and catalog (Python)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: The scripts, offline (fake aws, gh and curl)
        run: tests/test_publish_offline.sh
      # Twice, then nothing may be left: no /tmp/rba-* scratch, no gpg-agent
      # with a home under /tmp (each run cleans up after itself).
      - name: The scripts, offline, again
        run: tests/test_publish_offline.sh
      - name: Nothing left behind
        run: |
          left=$(find /tmp -maxdepth 1 -name 'rba-*' 2>/dev/null || true)
          agents=$(pgrep -ax gpg-agent | grep -F -- '--homedir /tmp/' || true)
          [[ -z $left && -z $agents ]] || { echo "::error::left behind: $left $agents"; exit 1; }
          echo "no /tmp/rba-* scratch and no gpg-agent under /tmp"
